<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management - Luxe Hotels</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="hotel.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Luxe Hotels Admin</h1>
            <nav>
                <ul>
                    <li><a href="./admin.html"><i class="ri-dashboard-line"></i> Dashboard</a></li>
                    <li><a href="./booking.html"><i class="ri-calendar-check-line"></i> Bookings</a></li>
                    <li><a href="./rooms.html"><i class="ri-hotel-bed-line"></i> Rooms</a></li>
                    <li><a href="./hotel.html" class="active"><i class="ri-building-line"></i> Hotels</a></li>
                    <li id="username"><i class="ri-user-3-fill"></i> <span></span></li>
                    <li id="logoutBtn" onclick="logout()"><i class="ri-logout-box-line"></i> Logout</li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h2>Manage Your Hotels</h2>
            <p>Add new hotels or manage existing properties</p>
            <div class="page-actions">
                <button class="btn-primary" onclick="displayHotelForm()">
                    <i class="ri-add-line"></i> Add New Hotel
                </button>
                <button class="btn-secondary" onclick="displayListHotels()">
                    <i class="ri-list-check"></i> View All Hotels
                </button>
            </div>
        </div>

        <div id="form-container" class="form-wrapper" style="display: none;">
            <div class="modern-form-container">
                <h3><i class="ri-building-line"></i> Add New Hotel</h3>
                <form id="booking-form" class="modern-form">
                    <div class="form-group">
                        <label for="area">Select Area</label>
                        <select id="area" required>
                            <option value="">Choose a city...</option>
                            <option value="Hyderabad">Hyderabad</option>
                            <option value="Bangalore">Bangalore</option>
                            <option value="Mumbai">Mumbai</option>
                            <option value="Delhi">Delhi</option>
                            <option value="Chennai">Chennai</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="name">Hotel Name</label>
                        <input type="text" id="name" placeholder="Enter hotel name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="amenities">Amenities</label>
                        <input type="text" id="amenities" placeholder="e.g., Pool, Gym, Spa, WiFi" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" placeholder="Enter full address" required>
                    </div>
                    
                    <button type="submit" class="submit-btn">
                        <i class="ri-save-line"></i> Add Hotel
                    </button>
                </form>
            </div>
        </div>

        <div id="bookings-list" class="table-container">
            <div class="table-header">
                <h3>Hotels Directory</h3>
                <div class="search-box">
                    <i class="ri-search-line"></i>
                    <input type="text" id="searchInput" placeholder="Search hotels..." onkeyup="searchHotels()">
                </div>
            </div>
            <div class="table-wrapper">
                <table class="modern-table">
                    <thead>
                        <tr>
                            <th><i class="ri-building-2-line"></i> Hotel Name</th>
                            <th><i class="ri-map-pin-line"></i> Area</th>
                            <th><i class="ri-star-line"></i> Amenities</th>
                            <th><i class="ri-road-map-line"></i> Location</th>
                            <th><i class="ri-settings-3-line"></i> Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Luxe Hotels. All rights reserved.</p>
    </footer>

    <script src="hotel.js"></script>
    <script>
        // Check if user is admin
        document.addEventListener('DOMContentLoaded', () => {
            const authToken = localStorage.getItem('auth-token');
            const userRole = localStorage.getItem('userRole');
            
            if (!authToken) {
                window.location.href = "./index.html";
                return;
            }
            
            if (userRole !== 'admin') {
                alert('Access Denied! Only administrators can access this page.');
                window.location.href = "./user.html";
                return;
            }
            
            // Set initial button state - View All Hotels is default
            const viewHotelsBtn = document.querySelector('.btn-secondary');
            if (viewHotelsBtn) {
                viewHotelsBtn.classList.add('active-view');
            }
        });
        
        function searchHotels() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toUpperCase();
            const table = document.querySelector('.modern-table');
            const tr = table.getElementsByTagName('tr');

            for (let i = 1; i < tr.length; i++) {
                const td = tr[i].getElementsByTagName('td');
                let found = false;
                
                for (let j = 0; j < td.length - 1; j++) {
                    if (td[j]) {
                        const txtValue = td[j].textContent || td[j].innerText;
                        if (txtValue.toUpperCase().indexOf(filter) > -1) {
                            found = true;
                            break;
                        }
                    }
                }
                
                tr[i].style.display = found ? '' : 'none';
            }
        }
    </script>
</body>
</html>
